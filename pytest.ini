[pytest]
pythonpath = src
testpaths = tests
# Two notices raised inside rasterio 1.5 with NumPy 2.5 and affine 3; they do not change any
# result. Filtered by their text only, so any other warning (including the package's own) shows.
filterwarnings =
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning
    ignore:Use `@` matmul instead of `\*` mul operator:PendingDeprecationWarning
